name:  Build and Publish image to Gitea Container Registry

on:
  push:
    branches:
      - testing
  workflow_dispatch:
jobs:
  docker:
    runs-on: cl3

    container:
      image: repo.tintindo.xyz/tintindohoang/docker-image:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Gitea Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: repo.tintindo.xyz
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.TOKEN_GITEA_CONTAINER }}
      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./dockerfile 
          push: true
          tags: repo.tintindo.xyz/tintindohoang/pagerdutycast:testing
