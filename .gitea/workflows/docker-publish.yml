name: Build and Publish image to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  publish_images:
    runs-on: cl3
    
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: https://github/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://github/docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: https://github/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: tintindohoang/pagerdutycast:latest